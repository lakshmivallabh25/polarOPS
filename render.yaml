# Render configuration for PolarOPS backend
services:
  - type: web
    name: polarops-backend          # you can rename it later in Render UI
    env: docker
    dockerfilePath: ./Dockerfile    # uses existing Dockerfile to build FastAPI
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        fromSecret: true            # will be set as a Render secret
      - key: SEMS_MODE
        value: "SCADA_MODE"
      - key: PORT
        value: "10000"
    plan: free
    region: oregon                  # any free region (oregon, frankfurt, singapore, etc.)
    autoDeploy: true